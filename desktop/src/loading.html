<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OwnIt</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #f7f5f0;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111214; color: #edebe6; }
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      #status { font-size: 13px; opacity: 0.7; min-height: 18px; text-align: center; max-width: 420px; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid rgba(255, 90, 31, 0.25);
        border-top-color: #ff5a1f;
        animation: spin 0.8s linear infinite;
      }
      #error { display: none; color: #c0392b; font-size: 13px; max-width: 460px; text-align: center; }
      #error a { color: #ff5a1f; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <h1>OwnIt</h1>
    <div id="status">Starting...</div>
    <div id="error"></div>
    <script>
      const { onStatus, onError } = window.ownit;
      onStatus((msg) => (document.getElementById("status").textContent = msg));
      onError((html) => {
        document.getElementById("spinner").style.display = "none";
        const el = document.getElementById("error");
        el.style.display = "block";
        el.innerHTML = html;
      });
    </script>
  </body>
</html>
